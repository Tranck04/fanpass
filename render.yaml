services:
  - type: web
    name: fanpass-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///fanpass.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: QR_SECRET_KEY
        generateValue: true
      - key: FANPASS_CORS_ORIGINS
        # Remplace par ton vrai domaine custom quand tu l'auras
        value: "https://fanpass-app.netlify.app/"
    plan: free
